<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Questões de Concurso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#eef3ee;--card:#fff;--tx:#17251d;--mut:#62756a;--ac:#2e6b48;--onac:#fff;--acl:#e3efe7;--ok:#1f8a4c;--okbg:#dff3e6;--er:#c0392b;--erbg:#fbe4e1;--bd:#d6e0d8;--sh:0 1px 2px rgba(20,40,28,.06),0 8px 22px rgba(20,40,28,.07);--ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--ser:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
[data-theme=dark]{color-scheme:dark;--bg:#0f1713;--card:#17221c;--tx:#e5eee8;--mut:#8da296;--ac:#5fbf86;--onac:#0f1713;--acl:#1f3328;--ok:#52c57f;--okbg:#173a26;--er:#ef7b6d;--erbg:#3d1f1b;--bd:#2b3d33;--sh:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:14.5px}
body{margin:0;background:var(--bg);color:var(--tx);font:1rem/1.55 var(--ui)}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--bd)}
header h1{flex:1;margin:0;font:700 1.25rem/1.2 var(--ser);color:var(--ac)}
.ghost{border:1px solid var(--bd);background:transparent;color:var(--mut);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.ghost:hover{background:var(--acl);color:var(--ac)}
#tabs{display:flex;gap:6px;max-width:760px;margin:14px auto 0;padding:0 16px}
#tabs button{border:0;background:transparent;color:var(--mut);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500}
#tabs button.on{background:var(--acl);color:var(--ac);font-weight:700}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.btn{border:1px solid var(--ac);background:var(--card);color:var(--ac);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);color:var(--onac)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e0a82e;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row>*{flex:1;min-width:150px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.row>button{flex:0 0 auto}
.q-text,.card>p:not(.mut){font-family:var(--ser);font-size:1.08rem;line-height:1.7}
.alt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);cursor:pointer}
.alt b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--acl);color:var(--ac);display:grid;place-items:center;font-size:.85rem}
.alt:hover:not(:disabled){border-color:var(--ac)}
.alt.sel{border-color:var(--ac);background:var(--acl)}
.alt.sel b{background:var(--ac);color:var(--onac)}
.alt.ok{background:var(--okbg);border-color:var(--ok)}
.alt.ok b{background:var(--ok);color:#fff}
.alt.er{background:var(--erbg);border-color:var(--er)}
.alt.er b{background:var(--er);color:#fff}
.alt:disabled{cursor:default;opacity:1}
.mut{color:var(--mut);font-size:.9rem}
.fb{margin-top:12px;padding:12px 14px;border-left:4px solid var(--ac);background:var(--acl);border-radius:0 10px 10px 0}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.tag{font-family:var(--ui);display:inline-block;font-size:.8rem;background:var(--acl);color:var(--ac);padding:3px 10px;border-radius:999px;margin:0 4px 4px 0}
#timer{position:sticky;top:8px;background:var(--card);border:1px solid var(--bd);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-weight:700;z-index:2;box-shadow:var(--sh)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}
#login input{width:100%;margin-bottom:10px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
@media(max-width:640px){
 #tabs{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:5}
 #tabs button{flex:1;padding:10px 4px;font-size:.85rem;border-radius:10px}
 main{padding-bottom:96px}
 .row>*{flex:1 1 100%}
 .card{padding:16px}
}
[hidden]{display:none!important}
#tabs{flex-wrap:wrap}
#tabs button{display:flex;gap:10px;align-items:center}
#tabs button.on{background:var(--ac);color:var(--onac)}
.sm{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;margin:0;font:inherit;color:var(--tx)}
.stat b{font:700 1.9rem/1.1 var(--ser);color:var(--ac)}
.hi{font:700 1.5rem/1.2 var(--ser);margin:4px 0 14px}
.card>p.tk{font:1rem/1.5 var(--ui);margin:6px 0;display:flex;gap:8px;align-items:center}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:start}
 header{grid-column:1/-1}
 #tabs{flex-direction:column;flex-wrap:nowrap;position:sticky;top:0;margin:0;max-width:none;padding:16px 12px;gap:4px;background:var(--card);border-right:1px solid var(--bd);min-height:calc(100vh - 62px)}
 #tabs button{width:100%;padding:12px 14px;border-radius:12px}
 main{max-width:900px;width:100%}
}
@media(max-width:640px){
 #tabs button{flex-direction:column;gap:2px}
 #tabs .ic{font-size:1.25rem;line-height:1}
 #tabs .lg{display:none}
 #tabs .sm{display:block;font-size:.66rem}
 #tabs button.on{background:var(--acl);color:var(--ac)}
}
/* menu lateral em verde forte */
:root{--side:#2e6b48}
[data-theme=dark]{--side:#1f4d36}
#tabs{background:var(--side);border-color:transparent}
#tabs button{color:rgba(255,255,255,.82)}
#tabs button:hover{background:rgba(255,255,255,.12)}
#tabs button.on{background:rgba(255,255,255,.22);color:#fff;font-weight:700}
/* banco de questões */
.fcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.fc{position:relative;display:flex;flex-direction:column;gap:6px;min-height:210px;padding:20px;border:0;border-radius:18px;text-align:left;cursor:pointer;color:#fff;font:inherit;background:linear-gradient(135deg,var(--c1,#0b5a44),var(--c2,#17b394));box-shadow:0 10px 24px rgba(0,0,0,.18);transition:transform .15s}
.fc:hover{transform:translateY(-3px)}
.fc.fx{--c1:#0b5a44;--c2:#17a085}
.fc .ic{font-size:2.1rem;line-height:1}
.fc b{font:700 1.3rem/1.2 var(--ui)}
.fc .sub{font-size:.92rem;opacity:.95}
.fc .pill{align-self:flex-start;margin-top:auto;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);font-size:.85rem;font-weight:600}
.fc .arr{position:absolute;right:18px;bottom:16px;font-size:1.4rem}
.fc .bd{position:absolute;top:14px;right:14px;padding:2px 10px;border-radius:999px;background:#fff;color:#2b2b2b;font-size:.72rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--ac)}
.chip small{margin-left:8px;color:var(--mut)}
.chip.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.chip.on small{color:inherit;opacity:.85}
@media(prefers-reduced-motion:reduce){.fc{transition:none}.fc:hover{transform:none}}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.nav .btn{flex:0 0 auto}
.nav #prox,.nav #pular{margin-left:auto}
/* banco de questões: layout em duas colunas, questão em verde */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;margin-bottom:16px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#1b4631,#2e6b48 55%,#3f8a5f)}
.banner b{font-size:1.15rem}
.banner span{opacity:.8;font-size:.9rem}
.banner .ghost{margin-left:auto;color:#fff;border-color:rgba(255,255,255,.45)}
.banner .ghost:hover{background:rgba(255,255,255,.15);color:#fff}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.qgrid.solo{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:8px}
.stack select{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
.chips.col{flex-direction:column;gap:8px}
.chips.col .chip{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border-radius:14px}
.chip small{background:var(--acl);color:var(--ac);border-radius:999px;padding:1px 10px;font-weight:700;font-size:.8rem;margin-left:0}
.chip.on small{background:rgba(255,255,255,.25);color:inherit;opacity:1}
.qcard{padding:24px;border-radius:22px;color:#fff;background:linear-gradient(160deg,#1b4631,#2e6b48);box-shadow:0 12px 30px rgba(20,60,40,.28)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qpill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.rst{border:0;background:none;color:rgba(255,255,255,.85);font-weight:700;cursor:pointer;font-size:.9rem}
.qn{margin:12px 0 0;font-size:.85rem;color:rgba(255,255,255,.75)}
.qe{margin:8px 0 18px;font-size:1.12rem;line-height:1.6;font-weight:500}
.qcard .alt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:14px;padding:14px 16px;margin:9px 0;font-weight:500}
.qcard .alt:hover:not(:disabled){background:rgba(255,255,255,.15);border-color:#fff}
.qcard .alt b{flex:0 0 22px;width:auto;height:auto;border-radius:0;background:none;color:rgba(255,255,255,.7);font-size:1rem;display:block}
.qcard .alt.ok{background:rgba(110,231,160,.28);border-color:#86efac}
.qcard .alt.er{background:rgba(248,113,113,.28);border-color:#fca5a5}
.qcard .alt.ok b,.qcard .alt.er b{background:none;color:#fff}
.qcard .alt:disabled{color:#fff}
.qcard .fb{background:rgba(255,255,255,.14);border-left-color:#86efac;color:#fff}
.skip{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px dashed rgba(255,255,255,.5);background:transparent;color:#fff;cursor:pointer}
.qfoot{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.2)}
.nb{padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer}
.nb.p{background:#fff;color:#1b4631;border-color:#fff}
.nb:disabled{opacity:.4;cursor:default}
.qc{text-align:center;line-height:1.25}.qc b{display:block}.qc span{font-size:.75rem;opacity:.8}
#stopw{position:fixed;right:18px;bottom:18px;z-index:6;display:flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:999px;background:#0e1a13;color:#fff;font:700 .95rem var(--ui);font-variant-numeric:tabular-nums;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer}
#stopw .dot{width:9px;height:9px;border-radius:50%;background:#9aa8a0}
#stopw .dot.on{background:#34d399;animation:pls 1.4s infinite}
@keyframes pls{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#stopw .dot.on{animation:none}}
@media(max-width:1180px){.qgrid{grid-template-columns:1fr}.qside{order:-1}.chips.col{max-height:180px;overflow:auto}}
@media(max-width:640px){#stopw{bottom:84px}.qcard{padding:18px}}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h2 style="margin-top:0">Entrar</h2>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="btn p" id="go" style="width:100%">Entrar</button>
    <p id="lerr" class="mut" style="color:var(--er)"></p>
  </div>
</div>

<div id="app" hidden>
<header>
  <h1>Questões de Concurso</h1>
  <button id="tema" class="ghost" type="button">☾ Escuro</button>
  <button id="sair" class="ghost" type="button">Sair</button>
</header>
<nav id="tabs" aria-label="Menu">
  <button data-v="i" class="on"><span class="ic">🏠</span><span class="lg">Início</span><span class="sm">Início</span></button>
  <button data-v="q"><span class="ic">📚</span><span class="lg">Banco de Questões</span><span class="sm">Questões</span></button>
  <button data-v="s"><span class="ic">🎯</span><span class="lg">Simulados</span><span class="sm">Simulado</span></button>
  <button data-v="e"><span class="ic">📓</span><span class="lg">Caderno de Erros</span><span class="sm">Erros</span></button>
  <button data-v="f"><span class="ic">🗂️</span><span class="lg">Flashcards</span><span class="sm">Cards</span></button>
  <button data-v="c"><span class="ic">📅</span><span class="lg">Cronograma</span><span class="sm">Plano</span></button>
  <button data-v="d"><span class="ic">📊</span><span class="lg">Meu desempenho</span><span class="sm">Dados</span></button>
</nav>
<button id="stopw" type="button" hidden title="Toque para pausar ou continuar o cronômetro" aria-label="Cronômetro de estudo"></button>
<main>
  <section id="v-i"><div id="ibox"></div></section>
  <section id="v-q" hidden>
    <div id="qhome"></div>
    <div id="qfront" hidden>
      <div class="banner"><b id="qtit"></b><span>· Banco de Questões</span><button class="ghost" id="qback" type="button">← Trocar de frente</button></div>
      <div class="qgrid" id="qgrid">
        <div id="qbox"></div>
        <aside class="card qside" id="qside">
          <h3 style="margin:0">📌 Assuntos</h3>
          <p class="mut" style="margin:0 0 12px">Toque para trocar</p>
          <div class="chips col" id="qchips"></div>
          <p class="mut" style="margin:16px 0 6px">Refinar</p>
          <div class="stack"><select id="fb"></select><select id="ft"><option value="">Todos os formatos</option><option value="certo_errado">Certo ou errado</option><option value="multipla_escolha">Múltipla escolha</option></select></div>
        </aside>
      </div>
    </div>
  </section>

  <section id="v-s" hidden>
    <div class="card">
      <div class="row">
        <select id="sd"></select>
        <input id="sn" type="number" min="1" value="20" aria-label="Número de questões" title="Número de questões">
        <input id="st" type="number" min="1" value="30" aria-label="Tempo em minutos" title="Tempo em minutos">
        <button class="btn p" id="iniciar">Iniciar simulado</button>
      </div>
      <p class="mut">Campos: disciplina, número de questões e tempo em minutos.</p>
    </div>
    <div id="sbox"></div>
  </section>

  <section id="v-e" hidden>
    <div class="row">
      <label style="flex:1;border:0;background:none"><input type="checkbox" id="so" style="min-width:0" checked> Mostrar só os erros</label>
      <button class="btn p" id="refazer">Refazer erros</button>
    </div>
    <div id="hbox"></div>
  </section>

  <section id="v-d" hidden><div id="dbox"></div></section>

  <section id="v-f" hidden>
    <div class="card"><div class="row"><input id="ff" placeholder="Frente (pergunta)"><input id="fv" placeholder="Verso (resposta)"><input id="fdc" placeholder="Disciplina (opcional)"><button class="btn p" id="fadd">Adicionar</button></div></div>
    <div id="fbox"></div>
  </section>

  <section id="v-c" hidden>
    <div class="card"><div class="row"><input id="ct" placeholder="Tarefa (ex.: estudar densidade)"><input id="cdis" placeholder="Disciplina (opcional)"><input id="cd" type="date" aria-label="Data"><button class="btn p" id="cadd">Adicionar</button></div></div>
    <div id="cbox"></div>
  </section>
</main>
</div>

<script>
const SB_URL='https://vyzjajwsslskzwmcrzab.supabase.co';
const SB_KEY='sb_publishable_eDM8r43UFCNFT3YU5Dq4hw_j5RRdAcb';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let fila=[],idx=0,sim=null,tick=null;

/* ---------- acesso ---------- */
async function init(){
  const {data}=await sb.auth.getSession();
  data.session?entrar():($('#login').hidden=false);
}
$('#go').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  error?$('#lerr').textContent='E-mail ou senha incorretos.':(location.reload());
};
$('#sair').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function entrar(){
  $('#login').hidden=true;$('#app').hidden=false;
  await filtros();inicio();
}

/* ---------- navegação ---------- */
function ver(v){
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['i','q','s','e','f','c','d'].forEach(k=>$('#v-'+k).hidden=k!==v);
  if(v!=='q'){tmPause();$('#stopw').hidden=true}if(v==='i')inicio();if(v==='q')bancoHome();if(v==='e')hist();if(v==='f')fc();if(v==='c')cron();if(v==='d')desemp();
}
document.querySelectorAll('nav button[data-v]').forEach(b=>b.onclick=()=>ver(b.dataset.v));

/* ---------- filtros ---------- */
async function tudo(t,cols){let o=[];for(let f=0;;f+=1000){const {data}=await sb.from(t).select(cols).range(f,f+999);if(!data)break;o=o.concat(data);if(data.length<1000)break}return o}
async function filtros(){
  const [q,r]=await Promise.all([tudo('questoes','id,disciplina,banca,assunto'),tudo('respostas','questao_id')]);
  bqAll=q;feitas=new Set(r.map(x=>x.questao_id));
  const u=k=>[...new Set(bqAll.map(x=>x[k]).filter(Boolean))].sort();
  $('#fb').innerHTML='<option value="">Todas as bancas</option>'+u('banca').map(v=>`<option>${esc(v)}</option>`).join('');
  $('#sd').innerHTML='<option value="">Todas as disciplinas</option>'+u('disciplina').map(v=>`<option>${esc(v)}</option>`).join('');
}
const pend=()=>bqAll.filter(x=>!feitas.has(x.id));
const CORES=[['#8a3d12','#d98a0a'],['#27278a','#7c3aed'],['#a3224a','#e8527a'],['#0f5f8a','#2fa8dc'],['#5b3a8a','#c05ad8']];
const ico=n=>/qu[ií]m/i.test(n)?'⚗️':/portugu|reda/i.test(n)?'📖':/matem|racioc/i.test(n)?'🧮':/legisl|direito|const/i.test(n)?'⚖️':/f[ií]s/i.test(n)?'🧲':/bio/i.test(n)?'🧬':/hist/i.test(n)?'🏛️':/geo/i.test(n)?'🌎':'📚';
let bqAll=[],feitas=new Set(),fd='',fa='',iniciou=false,modoErros=false;
function bancoHome(){
  const bq=pend();iniciou=false;modoErros=false;tmPause();$('#stopw').hidden=true;fila=[];$('#qbox').innerHTML='';$('#qfront').hidden=true;$('#qhome').hidden=false;
  const ds={};bq.forEach(r=>{const d=ds[r.disciplina]=ds[r.disciplina]||{n:0,as:{}};d.n++;if(r.assunto)d.as[r.assunto]=1});
  const nomes=Object.keys(ds).sort();
  const card=(i,ic,t,sub,pill,go)=>`<button class="fc" style="--c1:${CORES[i%5][0]};--c2:${CORES[i%5][1]}" data-go="${esc(go)}"><span class="ic">${ic}</span><b>${esc(t)}</b><span class="sub">${esc(sub)}</span><span class="pill">${pill}</span><span class="arr">➜</span></button>`;
  let h=nomes.map((n,i)=>{const a=Object.keys(ds[n].as);return card(i,ico(n),n,a.length?a.slice(0,3).join(', ')+(a.length>3?' e mais '+(a.length-3):''):'Todos os assuntos',ds[n].n+' questões','d:'+n)}).join('');
  if(nomes.length>1)h=card(nomes.length,'🗂️','Todas as disciplinas','Todos os assuntos em uma só lista.',bq.length+' questões','d:*')+h;
  h+='<button class="fc fx" data-go="x:d"><span class="bd">MEU</span><span class="ic">📊</span><b>Meu desempenho</b><span class="sub">Seus acertos e erros por disciplina e assunto: veja o que revisar.</span><span class="pill">acompanhe sua evolução</span><span class="arr">➜</span></button>';
  $('#qhome').innerHTML=`<h2 class="hi">Banco de Questões</h2><p class="mut" style="margin:-8px 0 14px">Escolha uma frente de estudo. Depois filtre por assunto.</p><div class="fcs">${bq.length?h:'<p class="mut">'+(bqAll.length?'Você respondeu todas as questões! Revise os erros no Caderno de Erros.':'O banco ainda está vazio. Importe as questões no Supabase.')+'</p>'}</div>`;
  document.querySelectorAll('#qhome [data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;g==='x:d'?ver('d'):frente(g.slice(2))});
}
function frente(d){
  fd=d==='*'?'':d;fa='';iniciou=false;modoErros=false;
  $('#qhome').hidden=true;$('#qfront').hidden=false;$('#qside').hidden=false;$('#qgrid').classList.remove('solo');
  $('#qbox').innerHTML='<div class="qcard"><p class="qe">Escolha um assunto na lista para começar.</p></div>';
  $('#qtit').textContent=d==='*'?'🗂️ Todas as disciplinas':ico(d)+' '+d;
  const base=pend().filter(r=>!fd||r.disciplina===fd),c={};
  base.forEach(r=>{if(r.assunto)c[r.assunto]=(c[r.assunto]||0)+1});
  const chip=(v,l,n)=>`<button class="chip" data-a="${esc(v)}">${esc(l)}<small>${n}</small></button>`;
  $('#qchips').innerHTML=chip('','Todos os assuntos',base.length)+Object.entries(c).sort().map(([a,n])=>chip(a,a,n)).join('');
  document.querySelectorAll('#qchips .chip').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#qchips .chip').forEach(x=>x.classList.toggle('on',x===b));
    fa=b.dataset.a;iniciou=true;buscar();
  });
}
$('#qback').onclick=bancoHome;
let tmS=0,tmRun=false,tmI=null;
const tmFmt=()=>[Math.floor(tmS/3600),Math.floor(tmS%3600/60),tmS%60].map(n=>String(n).padStart(2,'0')).join(':');
function tmDraw(){$('#stopw').innerHTML=`<i class="dot${tmRun?' on':''}"></i>${tmFmt()}`}
function tmStart(){if(tmI)return;tmRun=true;tmI=setInterval(()=>{tmS++;tmDraw()},1000);tmDraw()}
function tmPause(){clearInterval(tmI);tmI=null;tmRun=false;tmDraw()}
function tmReset(){tmPause();tmS=0;tmDraw()}
$('#stopw').onclick=()=>tmRun?tmPause():tmStart();
tmDraw();
$('#fb').onchange=$('#ft').onchange=()=>{if(iniciou)buscar()};

/* ---------- questões ---------- */
function opcoes(q){
  if(q.alternativas&&Object.keys(q.alternativas).length)return Object.entries(q.alternativas);
  return [['C','Certo'],['E','Errado']];
}
async function buscar(){
  let r=sb.from('questoes').select('*').limit(1000);
  if(fd)r=r.eq('disciplina',fd);
  if(fa)r=r.eq('assunto',fa);
  if($('#fb').value)r=r.eq('banca',$('#fb').value);
  if($('#ft').value)r=r.eq('tipo',$('#ft').value);
  const {data,error}=await r;
  if(error)return $('#qbox').innerHTML='<p class="mut">Erro ao buscar: '+esc(error.message)+'</p>';
  const tds=data||[];fila=shuf(tds.filter(x=>!feitas.has(x.id)));idx=0;
  if(!fila.length&&tds.length){$('#qbox').innerHTML='<div class="card">Você já respondeu todas as questões deste filtro. Revise os erros no Caderno de Erros.</div>';return}
  $('#stopw').hidden=false;tmStart();mostrar();
  $('#qbox').scrollIntoView({block:'start'});
}
const resp={},pul=new Set();
const fbHTML=(q,l)=>`<div class="fb"><b>${l===q.gabarito?'Correto!':'Errado.'}</b> Gabarito: ${esc(q.gabarito)}.${q.comentario?'<br>'+esc(q.comentario).replace(/\n/g,'<br>'):''}</div>`;
function mostrar(){
  const b=$('#qbox'),msg=t=>b.innerHTML='<div class="qcard"><p class="qe">'+t+'</p></div>';
  if(!fila.length)return msg('Nenhuma questão encontrada com esses filtros.');
  if(idx>=fila.length){
    b.innerHTML='<div class="qcard"><p class="qe">Você terminou esta lista de '+fila.length+' questões.</p><div class="qfoot"><button class="nb" id="ant" type="button">← Voltar à última</button><span></span><span></span></div></div>';
    $('#ant').onclick=()=>{idx--;mostrar()};return;
  }
  const q=fila[idx],a=resp[q.id],fei=fila.filter(x=>resp[x.id]).length,falt=fila.filter(x=>pul.has(x.id)&&!resp[x.id]).length;
  b.innerHTML=`<div class="qcard">
  <div class="qtop"><span class="qpill">${esc(q.disciplina)}${q.assunto?' · '+esc(q.assunto):''}</span>${modoErros?'':'<button class="rst" id="reiniciar" type="button">↻ Reiniciar</button>'}</div>
  <p class="qn">Questão ${idx+1} de ${fila.length} · ${esc(q.banca)}${q.ano?' · '+q.ano:''}${falt?` · ${falt} pulada${falt>1?'s':''}`:''}</p>
  <p class="qe">${esc(q.enunciado).replace(/\n/g,'<br>')}</p>
  <div id="alts">${opcoes(q).map(([l,t])=>`<button class="alt${a?(l===q.gabarito?' ok':l===a?' er':''):''}" data-l="${esc(l)}"${a?' disabled':''}><b>${esc(l)}</b> ${t===l?'':esc(t)}</button>`).join('')}</div>
  <div id="fbk">${a?fbHTML(q,a):''}</div>
  ${a?'':'<button class="skip" id="pular" type="button">Pular para depois ↪</button>'}
  <div class="qfoot"><button class="nb" id="ant" type="button"${idx?'':' disabled'}>← Anterior</button><div class="qc"><b>${idx+1} / ${fila.length}</b><span>${fei} respondida${fei===1?'':'s'}</span></div><button class="nb p" id="prox" type="button"${a?'':' disabled'}>Próxima →</button></div></div>`;
  b.querySelectorAll('.alt').forEach(x=>x.onclick=()=>responder(x.dataset.l));
  $('#ant').onclick=()=>{idx--;mostrar()};
  $('#prox').onclick=()=>{idx++;mostrar()};
  if($('#pular'))$('#pular').onclick=pular;
  if($('#reiniciar'))$('#reiniciar').onclick=()=>{tmReset();pul.clear();buscar()};
}
function pular(){
  const q=fila[idx];
  if(!fila.slice(idx+1).some(x=>!resp[x.id])){$('#fbk').innerHTML='<div class="fb">Esta é a última questão pendente desta lista.</div>';return}
  pul.add(q.id);fila.splice(idx,1);fila.push(q);mostrar();
}
async function responder(l){
  const q=fila[idx];if(resp[q.id])return;
  resp[q.id]=l;pul.delete(q.id);feitas.add(q.id);mostrar();
  const {error}=await sb.from('respostas').insert({questao_id:q.id,resposta:l,correta:l===q.gabarito});
  if(error){delete resp[q.id];feitas.delete(q.id);mostrar();$('#fbk').innerHTML='<div class="fb">Não foi possível salvar a resposta: '+esc(error.message)+'</div>'}
}

/* ---------- simulado ---------- */
$('#iniciar').onclick=async()=>{
  let r=sb.from('questoes').select('*').limit(1000);
  if($('#sd').value)r=r.eq('disciplina',$('#sd').value);
  const {data}=await r;
  const n=Math.max(1,+$('#sn').value||1),min=Math.max(1,+$('#st').value||1);
  const qs=shuf(data||[]).slice(0,n);
  if(!qs.length)return $('#sbox').innerHTML='<p class="mut">Não há questões para este simulado.</p>';
  const {data:s}=await sb.from('simulados').insert({titulo:'Simulado '+new Date().toLocaleDateString('pt-BR'),qtd_questoes:qs.length,tempo_minutos:min}).select().single();
  sim={id:s.id,qs,resp:{},fim:Date.now()+min*60000};
  $('#sbox').innerHTML='<div id="timer"></div>'+qs.map((q,i)=>`<div class="card"><p class="mut">Questão ${i+1} · ${esc(q.disciplina)}</p>
  <p>${esc(q.enunciado).replace(/\n/g,'<br>')}</p>
  ${opcoes(q).map(([l,t])=>`<button class="alt" data-i="${i}" data-l="${esc(l)}"><b>${esc(l)}</b> ${t===l?'':esc(t)}</button>`).join('')}</div>`).join('')+
  '<button class="btn p" id="fim">Finalizar simulado</button>';
  $('#sbox').querySelectorAll('.alt').forEach(a=>a.onclick=()=>{
    sim.resp[a.dataset.i]=a.dataset.l;
    $('#sbox').querySelectorAll(`.alt[data-i="${a.dataset.i}"]`).forEach(x=>x.classList.toggle('sel',x===a));
  });
  $('#fim').onclick=finalizar;
  clearInterval(tick);tick=setInterval(()=>{
    const s=Math.max(0,Math.round((sim.fim-Date.now())/1000));
    $('#timer').textContent='Tempo restante: '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
    if(s<=0)finalizar();
  },500);
};
async function finalizar(){
  if(!sim)return;clearInterval(tick);
  const S=sim;sim=null;
  const linhas=[];let ac=0;
  S.qs.forEach((q,i)=>{const l=S.resp[i];if(l){const ok=l===q.gabarito;if(ok)ac++;linhas.push({questao_id:q.id,simulado_id:S.id,resposta:l,correta:ok});feitas.add(q.id)}});
  if(linhas.length)await sb.from('respostas').insert(linhas);
  const nota=Math.round(ac/S.qs.length*1000)/10;
  await sb.from('simulados').update({finalizado_em:new Date().toISOString(),nota}).eq('id',S.id);
  $('#sbox').innerHTML=`<div class="card"><h2 style="margin-top:0">Nota: ${nota}%</h2><p>${ac} acertos em ${S.qs.length} questões (${S.qs.length-linhas.length} sem resposta).</p></div>`+
  S.qs.map((q,i)=>{const l=S.resp[i],ok=l===q.gabarito;return `<div class="card"><p class="mut">Questão ${i+1} · ${l?(ok?'acertou':'errou'):'sem resposta'}</p>
  <p>${esc(q.enunciado).replace(/\n/g,'<br>')}</p><p>Sua resposta: <b>${esc(l||'—')}</b> · Gabarito: <b>${esc(q.gabarito)}</b></p>${q.comentario?`<div class="fb">${esc(q.comentario)}</div>`:''}</div>`}).join('');
}

/* ---------- histórico ---------- */
async function hist(){
  const {data,error}=await sb.from('respostas').select('id,resposta,correta,respondida_em,questoes(id,enunciado,disciplina,assunto,gabarito)').order('respondida_em',{ascending:false}).limit(150);
  if(error)return $('#hbox').innerHTML='<p class="mut">Erro: '+esc(error.message)+'</p>';
  const l=(data||[]).filter(r=>r.questoes&&(!$('#so').checked||!r.correta));
  $('#hbox').innerHTML=l.length?l.map(r=>`<div class="card"><p class="mut">${new Date(r.respondida_em).toLocaleString('pt-BR')} · ${esc(r.questoes.disciplina)}${r.questoes.assunto?' · '+esc(r.questoes.assunto):''}</p>
  <p>${esc(r.questoes.enunciado.slice(0,220))}${r.questoes.enunciado.length>220?'…':''}</p>
  <p>Você marcou <b>${esc(r.resposta)}</b> · Gabarito <b>${esc(r.questoes.gabarito)}</b> · <b style="color:${r.correta?'var(--ok)':'var(--er)'}">${r.correta?'acertou':'errou'}</b></p></div>`).join(''):'<p class="mut">Nada por aqui ainda.</p>';
}
$('#so').onchange=hist;
$('#refazer').onclick=async()=>{
  const {data}=await sb.from('respostas').select('correta,questoes(*)').eq('correta',false).limit(500);
  const m=new Map();(data||[]).forEach(r=>r.questoes&&m.set(r.questoes.id,r.questoes));
  fila=shuf([...m.values()]);fila.forEach(x=>delete resp[x.id]);idx=0;ver('q');$('#qhome').hidden=true;$('#qfront').hidden=false;$('#qside').hidden=true;$('#qgrid').classList.add('solo');$('#qtit').textContent='📓 Refazendo erros';modoErros=true;$('#stopw').hidden=false;tmStart();mostrar();
};

/* ---------- desempenho ---------- */
async function desemp(){
  const {data,error}=await sb.from('respostas').select('correta,respondida_em,questoes(disciplina,assunto)').limit(5000);
  if(error)return $('#dbox').innerHTML='<p class="mut">Erro: '+esc(error.message)+'</p>';
  const d=(data||[]).filter(r=>r.questoes);
  if(!d.length)return $('#dbox').innerHTML='<p class="mut">Responda algumas questões para ver o seu desempenho.</p>';
  const grp=k=>{const m={};d.forEach(r=>{const n=r.questoes[k]||'Sem assunto';m[n]=m[n]||{t:0,a:0};m[n].t++;if(r.correta)m[n].a++});return Object.entries(m).sort((a,b)=>b[1].t-a[1].t)};
  const lin=([n,v])=>{const p=Math.round(v.a/v.t*100);return `<p style="margin:10px 0 2px">${esc(n)} <span class="mut">— ${v.a}/${v.t} (${p}%)</span></p><div class="bar"><i style="width:${p}%"></i></div>`};
  const tot=d.length,ac=d.filter(r=>r.correta).length;
  const dias={};d.forEach(r=>{const k=r.respondida_em.slice(0,10);dias[k]=dias[k]||{t:0,a:0};dias[k].t++;if(r.correta)dias[k].a++});
  const ult=Object.entries(dias).sort().slice(-7);
  $('#dbox').innerHTML=`<div class="card"><h2 style="margin:0">${Math.round(ac/tot*100)}% de acertos</h2><p class="mut">${ac} certas em ${tot} respostas</p></div>
  <div class="card"><h3 style="margin-top:0">Por disciplina</h3>${grp('disciplina').map(lin).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Por assunto</h3>${grp('assunto').map(lin).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Últimos dias</h3>${ult.map(([k,v])=>lin([new Date(k+'T12:00').toLocaleDateString('pt-BR'),v])).join('')}</div>`;
}
/* ---------- início ---------- */
const hoje=()=>new Date().toLocaleDateString('sv-SE');
async function inicio(){
  const h=hoje(),ini=new Date();ini.setHours(0,0,0,0);
  const [r,e,f,c]=await Promise.all([
    sb.from('respostas').select('correta').gte('respondida_em',ini.toISOString()),
    sb.from('respostas').select('id',{count:'exact',head:true}).eq('correta',false),
    sb.from('flashcards').select('id',{count:'exact',head:true}).lte('revisar_em',h),
    sb.from('cronograma').select('titulo,disciplina,concluida').eq('data',h)]);
  const d=r.data||[],t=d.length,ac=d.filter(x=>x.correta).length,ts=c.data||[];
  const k=(n,l,v)=>`<button class="card stat" data-go="${v}"><b>${n}</b><span class="mut">${l}</span></button>`;
  $('#ibox').innerHTML=`<h2 class="hi">Bom estudo!</h2><div class="grid">${k(t,'questões hoje','q')}${k(t?Math.round(ac/t*100)+'%':'—','de acertos hoje','d')}${k(e.count||0,'erros no caderno','e')}${k(f.count||0,'flashcards para revisar','f')}</div>
  <div class="card"><h3 style="margin-top:0">Tarefas de hoje</h3>${ts.length?ts.map(x=>`<p class="tk">${x.concluida?'✅':'⬜'} <span>${esc(x.titulo)}${x.disciplina?` <span class="mut">· ${esc(x.disciplina)}</span>`:''}</span></p>`).join(''):'<p class="mut">Nenhuma tarefa para hoje. Planeje no Cronograma.</p>'}</div>`;
  document.querySelectorAll('#ibox [data-go]').forEach(b=>b.onclick=()=>ver(b.dataset.go));
}

/* ---------- flashcards ---------- */
const INT=[1,3,7,14,30];let fcs=[],fi=0;
async function fc(){
  const {data,error}=await sb.from('flashcards').select('*').lte('revisar_em',hoje()).order('revisar_em').limit(100);
  if(error)return $('#fbox').innerHTML='<p class="mut">Erro: '+esc(error.message)+'</p>';
  fcs=data||[];fi=0;fcShow();
}
function fcShow(){
  const b=$('#fbox');
  if(fi>=fcs.length)return b.innerHTML='<div class="card">Nenhum flashcard para revisar agora. Adicione novos acima.</div>';
  const c=fcs[fi];
  b.innerHTML=`<div class="card"><p class="mut">Cartão ${fi+1} de ${fcs.length}${c.disciplina?' · '+esc(c.disciplina):''}</p><p>${esc(c.frente).replace(/\n/g,'<br>')}</p><div id="vv"></div><div id="vb"><button class="btn p" id="vr">Mostrar resposta</button></div></div>`;
  $('#vr').onclick=()=>{
    $('#vv').innerHTML=`<div class="fb">${esc(c.verso).replace(/\n/g,'<br>')}</div>`;
    $('#vb').innerHTML='<p style="display:flex;gap:8px"><button class="btn" id="fe">Errei</button><button class="btn p" id="fa">Acertei</button></p>';
    $('#fe').onclick=()=>fcRes(c,false);$('#fa').onclick=()=>fcRes(c,true);
  };
}
async function fcRes(c,ok){
  const cx=ok?Math.min(c.caixa+1,5):1,d=new Date();d.setDate(d.getDate()+INT[cx-1]);
  await sb.from('flashcards').update({caixa:cx,revisar_em:d.toLocaleDateString('sv-SE')}).eq('id',c.id);
  fi++;fcShow();
}
$('#fadd').onclick=async()=>{
  const f=$('#ff').value.trim(),v=$('#fv').value.trim();if(!f||!v)return;
  await sb.from('flashcards').insert({frente:f,verso:v,disciplina:$('#fdc').value.trim()||null});
  $('#ff').value=$('#fv').value=$('#fdc').value='';fc();
};

/* ---------- cronograma ---------- */
$('#cd').value=hoje();
async function cron(){
  const {data,error}=await sb.from('cronograma').select('*').order('data').limit(300);
  if(error)return $('#cbox').innerHTML='<p class="mut">Erro: '+esc(error.message)+'</p>';
  const h=hoje(),l=data||[];
  if(!l.length)return $('#cbox').innerHTML='<p class="mut">Nenhuma tarefa ainda. Adicione a primeira acima.</p>';
  const g={};l.forEach(t=>(g[t.data]=g[t.data]||[]).push(t));
  $('#cbox').innerHTML=Object.entries(g).map(([d,ts])=>`<div class="card"><h3 style="margin:0 0 6px">${new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}${d===h?' <span class="tag">hoje</span>':d<h?' <span class="tag">passado</span>':''}</h3>${ts.map(t=>`<p class="tk"><input type="checkbox" data-id="${t.id}" ${t.concluida?'checked':''}><span style="flex:1;${t.concluida?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.titulo)}${t.disciplina?` <span class="mut">· ${esc(t.disciplina)}</span>`:''}</span><button class="ghost" data-del="${t.id}" aria-label="Apagar tarefa">✕</button></p>`).join('')}</div>`).join('');
  document.querySelectorAll('#cbox [data-id]').forEach(i=>i.onchange=async()=>{await sb.from('cronograma').update({concluida:i.checked}).eq('id',i.dataset.id);cron()});
  document.querySelectorAll('#cbox [data-del]').forEach(b=>b.onclick=async()=>{await sb.from('cronograma').delete().eq('id',b.dataset.del);cron()});
}
$('#cadd').onclick=async()=>{
  const t=$('#ct').value.trim(),d=$('#cd').value;if(!t||!d)return;
  await sb.from('cronograma').insert({titulo:t,disciplina:$('#cdis').value.trim()||null,data:d});
  $('#ct').value=$('#cdis').value='';cron();
};

/* ---------- tema ---------- */
function tema(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('tema',t)}catch(e){}$('#tema').textContent=t==='dark'?'☀ Claro':'☾ Escuro'}
(function(){let t;try{t=localStorage.getItem('tema')}catch(e){}t=t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');tema(t)})();
$('#tema').onclick=()=>tema(document.documentElement.dataset.theme==='dark'?'light':'dark');
init();
</script>
</body>
</html>
